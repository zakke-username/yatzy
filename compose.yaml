name: yatzy

services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    ports:
      # Only reachable from this machine (nginx)
      - "127.0.0.1:3000:3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", ""]
    restart: unless-stopped
    user: redis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
